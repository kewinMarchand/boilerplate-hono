name: boilerplate-hono

services:
  api:
    build:
      context: .
      target: dev
    image: boilerplate-hono:dev
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://app:app@mongo:27017/?authSource=admin
      MONGODB_DB: app
      MAILER_DSN: smtp://mailpit:1025
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./:/app
    ports:
      - '127.0.0.1:${API_PORT:-8091}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/api/tasks']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Comparaison avec l'API Platform : réseau de la machine pour joindre 8090 et 8091.
  contract:
    profiles: [tools]
    image: boilerplate-hono:dev
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    network_mode: host
    environment:
      HOME: /tmp
    volumes:
      - ./:/app
    command: ['yarn', '-s', 'contract']

  mongo:
    image: mongo:8.2
    # Limite recommandée par MongoDB : 1024 (défaut de Docker) ne suffit pas aux bases de test ouvertes en parallèle
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    environment:
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: app
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mongo_data:/data/db

  # Boîte de réception de développement : interface sur 8027, SMTP (1025) seulement dans le réseau du compose
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8027}:8025'

volumes:
  mongo_data:
